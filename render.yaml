services:
  - type: web
    name: shikayat-toggle-wars
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SEND_ENABLED
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: PUBLIC_DEMO
        value: "true"
      - key: REPLAY_MODE
        value: "true"
      - key: BUDGET_USD
        value: "3"
      - key: MODEL_SMART
        value: gpt-5.4
      - key: MODEL_FAST
        value: gpt-5.4-mini
      - key: MODEL_RATES_JSON
        value: '{"gpt-5.4":{"input":2.5,"output":15},"gpt-5.4-mini":{"input":0.75,"output":4.5}}'
      - key: ADMIN_PASSCODE
        sync: false
      - key: FLAGSMITH_ENVIRONMENT_ID
        sync: false
