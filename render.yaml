services:
  - type: web
    name: shikayat-toggle-wars
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: SEND_ENABLED
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: PUBLIC_DEMO
        value: "true"
      - key: REPLAY_MODE
        value: "true"
      - key: LLM_PROVIDER
        value: openrouter
      - key: BUDGET_USD
        value: "3"
      - key: MODEL_SMART
        value: openrouter/free
      - key: MODEL_FAST
        value: openrouter/free
      - key: MODEL_RATES_JSON
        value: '{"openrouter/free":{"input":0,"output":0}}'
      - key: ADMIN_PASSCODE
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FLAGSMITH_ENVIRONMENT_ID
        sync: false
